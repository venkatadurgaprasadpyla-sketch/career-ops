# UAE employers to resolve into scannable job boards — input for discover-ats.
#
#   node discover-ats.mjs --in presets/uae-pm-ops/companies.yml --summary   # preview, writes nothing
#   node discover-ats.mjs --in presets/uae-pm-ops/companies.yml --write     # append verified boards to portals.yml
#
# discover-ats probes each company live (zero AI tokens) and only adds a board
# that exists AND currently lists jobs. Anything it cannot resolve is reported
# as "unresolved" — those employers are still covered by the web-search queries
# in portals.yml (/career-ops scan).
#
# Workday employers need a `workday:` hint (the address-bar URL of their
# myworkdayjobs.com job search). The hints below are best guesses and are
# confirmed live by discover-ats; a wrong one simply comes back unresolved.
# To add one: open the employer's careers page → "Search jobs" → copy the
# <tenant>.wd<N>.myworkdayjobs.com/<site> address.

companies:
